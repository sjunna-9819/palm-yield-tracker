<style>
/* Layout: full-bleed 3D field, one compact field-card top-left, view switcher bottom */
:root {
  --bg: #e9efe4; --panel: rgba(250, 252, 246, .92); --ink: #1d2a1f; --muted: #5d6b5f; --line: #d3dccb;
  --accent: #2d6a3e; --fence: #58d47c; --chip: #eef3e8;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1611; --panel: rgba(22, 31, 24, .9); --ink: #e8efe6; --muted: #9aab9c; --line: #2f3c31; --accent: #6fbf84; --chip: #1e2a20; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f1611; --panel: rgba(22, 31, 24, .9); --ink: #e8efe6; --muted: #9aab9c; --line: #2f3c31; --accent: #6fbf84; --chip: #1e2a20; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.card { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 10px; }
.card h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; margin: 0; line-height: 1; text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.row output { font-family: var(--f-display); font-size: 17px; color: var(--ink); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--f-body); padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible, .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin: 0; }
.toggle { display: none; }
.views { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.views button { font: 600 14px var(--f-body); border: 0; background: transparent; color: var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.views button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.compass { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 46px; height: 46px;
  border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.compass svg { width: 34px; height: 34px; }
#loading[hidden] { display: none; }
.tag3d { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; font: 700 20px var(--f-display); letter-spacing: .04em; color: #fff; background: rgba(29, 42, 31, .82); padding: 4px 12px; border-radius: 8px; white-space: nowrap; }
.tag3d::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(29, 42, 31, .82); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px var(--f-body); color: var(--muted); pointer-events: none; }
@media (max-width: 560px) {
  .card { padding: 10px 12px; gap: 8px; }
  .card h1 { font-size: 20px; }
  .card:not(.open) .more { display: none; }
  .toggle { display: inline-flex; position: absolute; top: 8px; right: 8px; }
  .views button { padding: 8px 11px; font-size: 13px; }
}
.back { font: 600 13px var(--f-body); color: var(--accent); text-decoration: none; margin-right: 10px; }

$('gpsClear').onclick = () => { try { localStorage.removeItem(FIT_KEY); if (BLOCK === 'file') localStorage.removeItem(RAW_KEY); } catch (e) {} location.search = ''; };
if (gpsInfo) {
  $('gpsClear').hidden = false;
  $('gpsNote').hidden = false;
  $('gpsNote').textContent = `${gpsInfo.n} palms are placed from GPS (${BLOCK === 'file' ? 'loaded file' : 'block ' + BLOCK}), fitted to the photo with an average gap of ${gpsInfo.err.toFixed(1)} m${Math.abs(gpsInfo.rot) > 0.5 ? `, turned ${gpsInfo.rot.toFixed(1)}°` : ''}. Rows not surveyed yet still use the photo.`;
}
$('more').onclick = () => { const o = $('card').classList.toggle('open'); $('more').setAttribute('aria-expanded', o); $('more').textContent = o ? 'Less' : 'More'; };

/* ---------- camera views ---------- */
const farmC = (() => { let x = 0, z = 0; F.poly.forEach(p => { x += p[0]; z += p[1]; }); return [x / F.poly.length, z / F.poly.length]; })();
const shed = F.blds.find(b => b.kind === 'compound') || F.blds[0] || { x: 0, z: 0 };
const VIEWS = {
  over: { p: [farmC[0] - 130, 140, farmC[1] + 200], t: [farmC[0], 0, farmC[1] + 10] },
  top: { p: [farmC[0], 420, farmC[1] + 1], t: [farmC[0], 0, farmC[1]] },
  shed: { p: [shed.x - 30, 24, shed.z + 52], t: [shed.x, 2, shed.z] },
  walk: { p: [farmC[0] + 20, 1.7, farmC[1] + 24], t: [farmC[0] + 8, 3.6, farmC[1] + 6] }
};
{ const y = P.find(p => p[2] < 0.15), m = P.find(p => p[2] > 0.95);
  if (y) VIEWS.young = { p: [y[0] + 7, 2.2, y[1] + 9], t: [y[0], 1.2, y[1]] };
  if (m) VIEWS.mature = { p: [m[0] + 9, 2.2, m[1] + 11], t: [m[0], 3.2, m[1]] };
  let best = null;
  for (let gx = -60; gx <= 60; gx += 1.5) for (let gz = -60; gz <= 60; gz += 1.5) {
    const x = farmC[0] + gx, z = farmC[1] + gz; if (!inPoly(x, z) || inYard(x, z)) continue;
    let d = 1e9, dense = 0; for (const p of P) { const dd = Math.hypot(p[0] - x, p[1] - z); if (dd < d) d = dd; if (dd < 15 && p[2] > 0.6) dense++; }
    const score = Math.min(d, 4.5) * 10 + dense; if (!best || score > best.s) best = { s: score, x, z };
  }
  if (best) VIEWS.walk = { p: [best.x, 1.7, best.z], t: [best.x + 12, 3, best.z - 6] }; }
let tween = null;
function go(v, instant) {
  const V0 = VIEWS[v]; document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  if (mobile && v === 'over') V0.p = [farmC[0] - 190, 230, farmC[1] + 300];
  const to = { p: new THREE.Vector3(...V0.p), t: new THREE.Vector3(...V0.t) };
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { camera.position.copy(to.p); controls.target.copy(to.t); tween = null; return; }
  tween = { from: { p: camera.position.clone(), t: controls.target.clone() }, to, t0: performance.now(), dur: 1600 };
}
document.querySelectorAll('.views button').forEach(b => b.onclick = () => go(b.dataset.v));
controls.addEventListener('start', () => { tween = null; });

/* ---------- loop ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
go(({ '#v-top': 'top', '#v-shed': 'shed', '#v-walk': 'walk', '#v-young': 'young', '#v-mature': 'mature' })[location.hash] || 'over', true);
const needle = $('needle'), dir = new THREE.Vector3();
renderer.setAnimationLoop(now => {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2;
    camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e); if (k === 1) tween = null;
  }
  controls.update();
  waterNormal.offset.set(now * 0.00001, now * 0.000006);
  { V.set(farmC[0], 14, farmC[1]).project(camera); const tg = $('tag3d'), show = V.z < 1 && Math.abs(V.x) < 1.1 && Math.abs(V.y) < 1.1 && camera.position.y > 12;
    tg.hidden = !show; if (show) tg.style.transform = `translate(${(V.x + 1) / 2 * innerWidth}px, ${(1 - V.y) / 2 * innerHeight}px) translate(-50%, -100%)`; }
  camera.getWorldDirection(dir); needle.style.transform = `rotate(${Math.atan2(dir.x, -dir.z) * -180 / Math.PI}deg)`;
  renderer.render(scene, camera);
});
})();
