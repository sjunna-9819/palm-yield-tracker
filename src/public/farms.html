<style>
/* Layout: full-bleed 3D field, one compact field-card top-left, view switcher bottom */
:root {
  --bg: #e9efe4; --panel: rgba(250, 252, 246, .92); --ink: #1d2a1f; --muted: #5d6b5f; --line: #d3dccb;
  --accent: #2d6a3e; --fence: #58d47c; --chip: #eef3e8;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1611; --panel: rgba(22, 31, 24, .9); --ink: #e8efe6; --muted: #9aab9c; --line: #2f3c31; --accent: #6fbf84; --chip: #1e2a20; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f1611; --panel: rgba(22, 31, 24, .9); --ink: #e8efe6; --muted: #9aab9c; --line: #2f3c31; --accent: #6fbf84; --chip: #1e2a20; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.card { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 10px; }
.card h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; margin: 0; line-height: 1; text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.row output { font-family: var(--f-display); font-size: 17px; color: var(--ink); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--f-body); padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible, .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin: 0; }
.toggle { display: none; }
.views { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.views button { font: 600 14px var(--f-body); border: 0; background: transparent; color: var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.views button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.compass { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 46px; height: 46px;
  border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.compass svg { width: 34px; height: 34px; }
#loading[hidden] { display: none; }
.hours { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.hours::-webkit-scrollbar { display: none; }
.hours button { flex: none; min-width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: inherit; font: 600 14px var(--f-display); cursor: pointer; }
.hours button[aria-pressed="true"] { background: #f5a623; border-color: #f5a623; color: #1b1b1b; }
.hours button:disabled { opacity: .3; cursor: default; }
.hours .play { min-width: 48px; background: rgba(245,166,35,.18); border-color: #f5a623; }
.sunline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; font-weight: 600; margin-top: 8px; }
.sunline span { display: inline-flex; align-items: center; gap: 6px; }
.sunline i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.sunline .rise i { background: #f5a623; } .sunline .set i { background: #c2477a; }
.suntag { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; font: 700 15px var(--f-display); color: #1b1b1b; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
.suntag.rise { background: #f5a623; } .suntag.set { background: #c2477a; color: #fff; }
.seasons button { min-width: 0; padding: 0 10px; }
.sunyear { font-size: 13px; line-height: 1.45; opacity: .9; }
.tag3d { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; font: 700 20px var(--f-display); letter-spacing: .04em; color: #fff; background: rgba(29, 42, 31, .82); padding: 4px 12px; border-radius: 8px; white-space: nowrap; }
.tag3d::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(29, 42, 31, .82); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px var(--f-body); color: var(--muted); pointer-events: none; }
@media (max-width: 560px), (max-height: 500px) {
  /* phones: closed = slim strip (title, More, hour bar); open = at most half the screen, scrolls inside */
  .card { padding: 8px 10px; gap: 6px; width: calc(100% - 84px); left: max(10px, env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px));
    max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; }
  .card h1 { font-size: 18px; display: inline; }
  .card:not(.open) .more, .card:not(.open) .stats, .card:not(.open) .sunline { display: none !important; }
  .card > * { flex-shrink: 0; }
  .card .hours { margin-top: 0; }
  .card .hours button { min-width: 36px; height: 34px; font-size: 13px; }
  .toggle { display: inline-flex; position: absolute; top: 6px; right: 8px; padding: 4px 12px; }
  .stats b { font-size: 18px; }
  .compass { width: 40px; height: 40px; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); }
  .views button { padding: 7px 10px; font-size: 13px; }
}
.back { font: 600 13px var(--f-body); color: var(--accent); text-decoration: none; margin-right: 10px; }
</style>

(() => {
const $ = id => document.getElementById(id);
const mobile = Math.min(innerWidth, innerHeight) < 600;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

/* ---------- renderer, scene, camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.75 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.5;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3; controls.maxDistance = 900 * (F.span || 1); controls.screenSpacePanning = false;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const uTime = { value: 0 };   // seconds; drives wind and drifting cloud shadows

/* ---------- canvas texture helpers ---------- */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; if (opts.srgb !== false) t.encoding = THREE.sRGBEncoding;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t;
}
// one oil-palm frond: rachis down the middle, leaflets on both sides angled toward the tip
const frondTex = canvasTex(256, 1024, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  const P0 = 0.2;   // bare, spiny petiole: no leaflets on the first fifth of the frond
  for (let i = 0; i < 300; i++) {
    const t = P0 + (i / 300) * (1 - P0), y = h - t * h * 0.985, u = (t - P0) / (1 - P0);
    const env = Math.pow(Math.sin(Math.PI * Math.min(1, u * 0.95 + 0.05)), 0.55);
    const L = (w / 2 - 4) * env * (0.55 + Math.random() * 0.5); if (L < 5) continue;
    const side = i % 2 ? 1 : -1, ang = 0.3 + Math.random() * 0.6, l = 150 + Math.random() * 80; if (Math.random() < 0.12) continue;
    g.strokeStyle = `rgb(${l * 0.9 | 0},${l | 0},${l * 0.75 | 0})`; g.lineWidth = 1.8 + env * 2.2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(w / 2, y);
    g.quadraticCurveTo(w / 2 + side * L * 0.5, y - L * Math.sin(ang) * 0.35, w / 2 + side * L * Math.cos(ang * 0.4), y - L * Math.sin(ang) * 0.9 - 4); g.stroke();
  }
  g.strokeStyle = 'rgb(215,205,150)'; g.lineCap = 'butt';
  for (let y = h; y > 4; y -= 4) { const t = 1 - y / h; g.lineWidth = 9 - t * 7; g.beginPath(); g.moveTo(w / 2, y); g.lineTo(w / 2, y - 5); g.stroke(); }
  g.strokeStyle = 'rgb(190,180,120)'; g.lineWidth = 1.5;
  for (let y = h - 10; y > h * (1 - P0); y -= 14) { g.beginPath(); g.moveTo(w / 2 - 5, y); g.lineTo(w / 2 - 14, y - 8); g.moveTo(w / 2 + 5, y - 7); g.lineTo(w / 2 + 14, y - 15); g.stroke(); }
});
// trunk: rough diamond pattern of old frond bases
const trunkTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#3f3a2a'; g.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(${70 + Math.random() * 30 | 0},${85 + Math.random() * 30 | 0},${40 + Math.random() * 20 | 0},.35)`; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 20 + Math.random() * 30, 10 + Math.random() * 30, 0, 0, 6.28); g.fill(); } for (let i = 0; i < 3000; i++) { const v = 40 + Math.random() * 50; g.fillStyle = `rgba(${v + 15},${v + 8},${v},.5)`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
  for (let r = 0; r < 16; r++) for (let c = 0; c < 6; c++) {
    const x = (c + (r % 2) * 0.5) * w / 6 + (Math.random() - 0.5) * 10, y = r * h / 16 + (Math.random() - 0.5) * 8, s = 0.7 + Math.random() * 0.5, v = 60 + Math.random() * 40;
    g.fillStyle = `rgb(${v + 18 | 0},${v + 6 | 0},${v - 12 | 0})`;

    ? (gpsInfo.n ? `${gpsInfo.n} of your ${gpsInfo.total} geo-tagged palms are on ${F.geos ? 'these farms' : 'this farm'}, each placed exactly at its GPS spot (yellow ring).${gpsInfo.total > gpsInfo.n ? ` The other ${gpsInfo.total - gpsInfo.n} are on another farm.` : ''} Palms not tagged yet still come from the photo.`

$('more').onclick = () => { const o = $('card').classList.toggle('open'); $('more').setAttribute('aria-expanded', o); $('more').textContent = o ? 'Less' : 'More'; };

/* ---------- camera views ---------- */
const farmC = farmCentre(), SPAN = F.span || 1;   // SPAN > 1 pulls the overview camera back for wide pages
const shed = F.blds.find(b => b.kind === 'compound') || F.blds[0] || { x: 0, z: 0 };
const VIEWS = {
  over: { p: [farmC[0] - 130 * SPAN, 140 * SPAN, farmC[1] + 200 * SPAN], t: [farmC[0], 0, farmC[1] + 10] },
  top: { p: [farmC[0], 420 * SPAN, farmC[1] + 1], t: [farmC[0], 0, farmC[1]] },
  shed: BAMB[0] > 0 ? { p: [shed.x - 16, BAMB[0] + 26, shed.z + 30], t: [shed.x, 2, shed.z] } : { p: [shed.x - 30, 24, shed.z + 52], t: [shed.x, 2, shed.z] },   // over a tall hedge
  walk: { p: [farmC[0] + 20, 1.7, farmC[1] + 24], t: [farmC[0] + 8, 3.6, farmC[1] + 6] }
};
{ const y = P.find(p => p[2] < 0.15), m = P.find(p => p[2] > 0.95);
  if (y) VIEWS.young = { p: [y[0] + 7, 2.2, y[1] + 9], t: [y[0], 1.2, y[1]] };
  if (m) VIEWS.mature = { p: [m[0] + 9, 2.2, m[1] + 11], t: [m[0], 3.2, m[1]] };
  let best = null; const wc = (() => { const q = POLYS[0]; let x = 0, z = 0; q.forEach(p => { x += p[0]; z += p[1]; }); return [x / q.length, z / q.length]; })();
  for (let gx = -60; gx <= 60; gx += 1.5) for (let gz = -60; gz <= 60; gz += 1.5) {
    const x = wc[0] + gx, z = wc[1] + gz; if (!inPoly(x, z) || inYard(x, z)) continue;
    let d = 1e9, dense = 0; for (const p of P) { const dd = Math.hypot(p[0] - x, p[1] - z); if (dd < d) d = dd; if (dd < 15 && p[2] > 0.6) dense++; }
    const score = Math.min(d, 4.5) * 10 + dense; if (!best || score > best.s) best = { s: score, x, z };
  }
  if (best) VIEWS.walk = { p: [best.x, 1.7, best.z], t: [best.x + 12, 3, best.z - 6] }; }

function go(v, instant) {

  const to = { p: new THREE.Vector3(...V0.p), t: new THREE.Vector3(...V0.t) };
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { camera.position.copy(to.p); controls.target.copy(to.t); tween = null; return; }

document.querySelectorAll('.views button').forEach(b => b.onclick = () => go(b.dataset.v));
controls.addEventListener('start', () => { tween = null; });

/* ---------- loop ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
go(({ '#v-top': 'top', '#v-shed': 'shed', '#v-walk': 'walk', '#v-young': 'young', '#v-mature': 'mature' })[location.hash] || 'over', true);
const needle = $('needle'), dir = new THREE.Vector3();
// floating name labels: one per farm (F.tags) or the page's single label over the middle
const TAGS = F.tags ? F.tags.map(t => { const el = $('tag3d').cloneNode(true); el.removeAttribute('id'); el.textContent = t.name; $('tag3d').after(el); return [el, t.x, t.z]; }) : [[$('tag3d'), farmC[0], farmC[1]]];

    const show = V.z < 1 && Math.abs(V.x) < 1.05 && Math.abs(V.y) < 1.05; el.hidden = !show; if (show) el.style.transform = `translate(${(V.x + 1) / 2 * innerWidth}px, ${(1 - V.y) / 2 * innerHeight}px) translate(-50%, -100%)`; });
