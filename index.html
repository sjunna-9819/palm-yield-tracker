<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palm Farm</title>
<meta name="theme-color" content="#2d6a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palm Farm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
  <script type="module" crossorigin src="./assets/index-DN9cl4gM.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-WkwZ5CU-.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DHaWAdyv.css">
</head>
<body>


<div class="app">
  <header class="top gut">
    <div class="farm"><h1 id="farmName">Palm Bunch Register</h1><div class="sub" id="farmSub"></div></div>
    <button class="helpbtn" id="helpBtn" data-t="guideBtn"></button>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" data-lang="en">EN</button><button id="lang-te" data-lang="te">తెలుగు</button>
    </div>
  </header>
  <div class="gut"><div class="banner" id="banner" hidden></div><div class="banner" id="syncNote" data-t="pendingSync" hidden></div></div>

  <main class="gut">
    <!-- Count -->
    <section data-view="count">
      <div class="panel opener">
        <button class="btn fruit continue" id="continueBtn" hidden></button>
        <div class="round" id="round"></div>
        <h2 data-t="openPalm" style="margin-top:6px"></h2>
        <div class="blocktabs" id="openBlocks"></div>
        <div class="numdisp" aria-live="polite"><span id="numBlock">B01</span><span class="dash">-</span><b id="numVal"></b><span class="of" id="numOf"></span></div>
        <div class="keypad" id="keypad">
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="go" class="go" id="kGo" data-t="openBtn"></button>
        </div>
        <button class="btn go" id="scanBtn" style="width:100%"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4M7 12h10"/></svg><span data-t="scanBtn"></span></button>
        <div class="hint" data-t="scanHint"></div>
        <button class="btn" id="nearBtn" style="width:100%"></button>
        <div id="nearOut" class="near" hidden>
          <div class="hint" id="nearStat"></div>
          <div class="hint" id="nearHead" data-t="nearClose" hidden></div>
          <div class="nearlist" id="nearList"></div>
        </div>
      </div>
    </section>
    <section data-view="count" class="panel">
      <h2 data-t="countedToday"></h2>
      <ul class="rows" id="todayList"></ul>
    </section>

    <!-- Dashboard -->
    <section data-view="dash" hidden>
      <h2 data-t="thisMonth"></h2>
      <div class="kpis" id="dashKpis"></div>
    </section>
    <section data-view="dash" hidden>
      <h2 data-t="forecast"></h2>
      <div class="kpis" id="fcKpis"></div>
      <div class="estnote" data-t="fcNote"></div>
    </section>
    <section data-view="dash" class="panel" hidden>
      <h2 data-t="stagesByMonth"></h2>
      <div class="legend" id="chartLegend"></div>
      <svg class="chart" id="chart" viewBox="0 0 640 230" role="img"></svg>
    </section>
    <section data-view="dash" class="panel" hidden>
      <h2 data-t="ovTitle"></h2>
      <div class="hint" data-t="ovHint" style="margin-bottom:6px"></div>
      <ul class="rows" id="ovList"></ul>
    </section>
    <section data-view="dash" class="panel" hidden>
      <h2 data-t="weak"></h2>
      <div class="hint" data-t="weakHint" style="margin-bottom:6px"></div>
      <ul class="rows" id="weakList"></ul>
    </section>
    <section data-view="dash" class="panel" hidden>
      <h2 data-t="notCounted"></h2>
      <ul class="rows" id="ncList"></ul>
    </section>

    <!-- Palms -->
    <section data-view="palms" class="panel" hidden>
      <h2 data-t="palmMap"></h2>
      <div class="blocktabs" id="mapBlocks"></div>
      <div class="blocktabs" id="mapFilters"></div>
      <div class="legend" id="legend"></div>
      <div class="grid-wrap"><div class="heat" id="heat"></div></div>
      <div id="fieldMap"></div>
      <div class="hint" id="mapHint"></div>
    </section>
    <section data-view="palms" class="panel" hidden>
      <h2 data-t="fieldTools"></h2>
      <div class="tool-grid">
        <button class="btn go" id="goSurvey" data-t="svOpen"></button>
        <a class="btn" id="go3d1" href="farm1.html" data-t="farm1_3d"></a>
        <a class="btn" id="go3d2" href="farm2.html" data-t="farm2_3d"></a>
      </div>
      <p class="hint" data-t="fieldToolsHint"></p>
    </section>

    <!-- Survey: GPS rows -->
    <section data-view="survey" hidden>
      <div class="sv-top">
        <button class="btn small" id="svBack" data-t="svBack"></button>
        <label class="field sv-blk"><span data-t="block"></span><select id="svBlock"></select></label>
        <span class="sv-gps"><span class="sv-dot" id="svDot"></span><span id="svGps"></span></span>
      </div>
      <p class="hint" data-t="svIntro"></p>
      <div id="svRows" class="sv-list"></div>
      <button class="btn go" id="svAdd" data-t="svAdd" style="width:100%"></button>
    </section>
    <section data-view="survey" class="panel" hidden>
      <h2 data-t="svMapT"></h2>
      <canvas id="svMap" width="800" height="640" aria-label="Survey map"></canvas>
      <div class="hint" id="svSummary"></div>
      <div class="tool-grid" style="margin-top:10px">
        <button class="btn go" id="svApply" data-t="svApply"></button>
        <button class="btn" id="svExport" data-t="svExportB"></button>
      </div>
      <p class="hint" data-t="svApplyHint"></p>
    </section>
    <section data-view="palms" class="panel" hidden>
      <h2 data-t="labels"></h2>
      <p class="hint" data-t="labelsHint" style="margin-top:0"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <select id="labelBlock" class="btn"></select>
        <button class="btn go" id="labelBtn" data-t="makeLabels"></button>
      </div>
      <div class="hint" id="labelStatus" style="margin-top:8px"></div>
      <div class="hint" id="gpsCount" style="margin-top:14px"></div>
      <button class="btn" id="gpsExport" data-t="gpsExport" style="margin-top:8px"></button>
    </section>

    <!-- Mill -->
    <section data-view="mill" class="panel" hidden>
      <h2 data-t="addTicket"></h2>
      <form class="form2" id="ticketForm">
        <label class="field"><span data-t="date"></span><input type="date" id="tkDate"></label>
        <label class="field"><span data-t="tonnes"></span><input id="tkTonnes" inputmode="decimal" placeholder="1.250" autocomplete="off"></label>
        <label class="field"><span data-t="tkBunches"></span><input id="tkBunches" inputmode="numeric" placeholder="63" autocomplete="off"></label>
        <label class="field"><span data-t="ticketNo"></span><input id="tkNo" autocomplete="off"></label>
        <label class="field wide"><span data-t="block"></span><select id="tkBlock"></select></label>
        <button class="btn go wide" type="submit" data-t="saveTicket"></button>
      </form>
    </section>
    <section data-view="mill" class="panel" hidden>
      <h2 data-t="tickets"></h2>
      <ul class="rows" id="ticketList"></ul>
    </section>

    <!-- Setup -->
    <section data-view="setup" class="panel" hidden>
      <h2 data-t="setup"></h2>
      <label class="field" style="margin-bottom:12px"><span data-t="farmNameL"></span><input id="setFarm" autocomplete="off"></label>
      <div class="grid-wrap">
        <table class="setup">
          <thead><tr><th data-t="blockId"></th><th data-t="acres"></th><th data-t="palms"></th><th data-t="planted"></th><th></th></tr></thead>
          <tbody id="setRows"></tbody>
        </table>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="btn" id="addBlock" data-t="addBlock"></button>
        <button class="btn go" id="saveSetup" data-t="saveSetup"></button>
      </div>
      <p class="hint" data-t="setupHint"></p>
      <div class="layout-box">
        <h2 data-t="dataTitle" style="margin:0"></h2>
        <div class="hint" id="dataMode"></div>
        <div class="tool-grid">
          <button class="btn" id="dataExport" data-t="dataExport"></button>
          <button class="btn" id="dataImport" data-t="dataImport"></button>
          <button class="btn go" id="dataUpload" data-t="dataUpload" hidden></button>
        </div>
        <input type="file" id="dataFile" accept="application/json,.json" hidden>
      </div>
      <div class="layout-box">
        <h2 data-t="layoutTitle" style="margin:0"></h2>
        <div class="hint" data-t="layoutHint"></div>
        <label class="field"><span data-t="block"></span><select id="layBlock"></select></label>
        <label class="field"><span data-t="layRows"></span><textarea id="layRows" inputmode="numeric" placeholder="24, 24, 23, 24"></textarea></label>
        <label class="ck"><input type="checkbox" id="layDiamond"><span data-t="layDiamond"></span></label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="layImport" data-t="layImport"></button>
          <button class="btn small" id="layClear" data-t="layClear"></button>
        </div>
        <input type="file" id="layFile" accept="application/json,.json" hidden>
        <div class="hint" id="layStatus"></div>
      </div>
    </section>

    <!-- Guide: fruit stages + how it works -->
    <section data-view="guide" hidden>
      <h2 data-t="stagesTitle"></h2>
      <div class="timeline" id="timeline"></div>
      <div class="hint" data-t="timelineHint" style="margin-bottom:10px"></div>
      <div class="guide-list" id="guideStages"></div>
      <div class="credits" id="credits"></div>
    </section>

  <nav class="tabs" id="tabs" role="tablist">

      <button class="tab" data-tab="palms" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-t="tPalms"></span></button>

      <button class="tab" data-tab="setup" role="tab" id="setupTab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-t="tSetup"></span></button>
    </div>
  </nav>
</div>

<!-- Palm sheet: monthly census -->
<div class="sheet gut" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="in">
    <div class="sh-head">
      <button class="nav" id="pPrev" aria-label="Previous palm">‹</button>
      <div class="sh-mid"><div class="palmid" id="pId"></div><div class="hint" id="pBlock"></div><span class="since" id="pSince"></span></div>
      <button class="nav" id="pNext" aria-label="Next palm">›</button>
      <button class="close" id="pClose" aria-label="Close">×</button>
    </div>
    <div class="form2">
      <label class="field"><span data-t="month"></span><input type="month" id="pMonth"></label>
      <div class="total" style="align-self:end;padding-bottom:6px"><span data-t="onPalm"></span><b id="pTotal">0</b></div>
    </div>
    <div class="hint" data-t="tapPic"></div>
    <div class="stages" id="pStages"></div>
    <button class="malerow" id="pMale" aria-pressed="false"><img class="art" src="img/male.jpg" alt=""><span class="txt"><b data-t="s_male"></b><br><span class="hint" data-t="d_male_s"></span></span><span class="sw"></span></button>
    <div class="hint" id="pExisting"></div>
    <div class="panel">
      <h2 data-t="gpsTitle"></h2>
      <div class="hint" id="pGps" style="margin-bottom:10px"></div>
      <button class="btn" id="pGpsBtn" data-t="gpsBtn"></button>
    </div>
    <div class="panel">
      <h2 data-t="palmStatus"></h2>
      <div class="flags" id="pFlags"></div>
      <label class="field" style="margin-top:12px"><span data-t="note"></span><textarea id="pNote"></textarea></label>
    </div>
    <div class="panel">
      <h2 data-t="history"></h2>
      <ul class="rows" id="pHist"></ul>
    </div>
    <div class="savebar">
      <button class="btn go" id="pSave" data-t="save"></button>
      <button class="btn fruit" id="pSaveNext" data-t="saveNext"></button>
    </div>
  </div>
</div>
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt=""><div class="cap" id="zoomCap"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" hidden></button></div>


<div class="join gut" id="join" hidden></div>
<!-- survey: GPS marking sheet + small dialogs -->
<div class="sv-sheet" id="svMark" hidden>
  <div class="in">
    <div class="sv-msg" id="svMarkTitle"></div>
    <div class="sv-ring">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle id="svArc" cx="50" cy="50" r="44" fill="none" stroke="var(--leaf)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
      <div class="lbl"><b id="svSecs">0</b><span class="hint" id="svReads"></span></div>
    </div>
    <div id="svMarkAcc" class="sv-msg"></div>
    <div id="svMarkResult" class="sv-list" hidden></div>
    <button class="btn" id="svMarkCancel"></button>
  </div>
</div>
<div class="sv-sheet" id="svSheet" hidden><div class="in"></div></div>
